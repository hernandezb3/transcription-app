# SonarQube analysis config for the transcription app BACKEND (FastAPI/Python).
# Scanned from this subdir (projectBaseDir=backend) by .github/workflows/sonarqube.yml
# against the self-hosted server at https://sonarqube.okeanoslabs.com.
sonar.projectKey=transcription-backend
sonar.projectName=Transcription App — Backend

# Python source lives under app/. Paths are relative to this file's directory.
sonar.sources=app
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Coverage can be added later (pytest --cov=app --cov-report=xml) via:
#   sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/alembic/versions/**,**/migrations/**
