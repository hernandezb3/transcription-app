# TEMPLATE ONLY — do NOT commit real values. The live Secret is created
# imperatively at deploy time (see infra/k8s/README.md), so secrets never live
# in git. Keys here become env vars in the transcription-api container.
apiVersion: v1
kind: Secret
metadata:
  name: transcription-api-settings
  namespace: transcription
type: Opaque
stringData:
  # SQLAlchemy URL for the DO managed Postgres `transcriptions` database.
  # SSL is enforced in code for remote hosts — do NOT append ?sslmode=...
  db_connection_string: "postgresql+asyncpg://transcriptions:REPLACE_ME@portfolio-management-do-user-36216379-0.g.db.ondigitalocean.com:25060/transcriptions"

  # JSON mapped onto Storage.Settings (DO Spaces / S3). Bucket + Region + keys.
  storage_config: |
    {
      "Bucket": "REPLACE_ME",
      "ContainerName": "REPLACE_ME",
      "Region": "sfo3",
      "Endpoint": "https://sfo3.digitaloceanspaces.com",
      "AccessKey": "REPLACE_ME",
      "SecretKey": "REPLACE_ME"
    }

  # HS256 signing key for the app's JWTs (read directly by app/auth/security.py).
  JWT_SECRET_KEY: "REPLACE_ME_WITH_A_LONG_RANDOM_STRING"
