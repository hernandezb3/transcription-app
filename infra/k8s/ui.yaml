apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcription-ui
  namespace: transcription
  labels:
    app: transcription-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transcription-ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: transcription-ui
    spec:
      imagePullSecrets:
        - name: registry-okeanoslabs-registry
      containers:
        - name: transcription-ui
          image: registry.digitalocean.com/okeanoslabs-registry/transcription-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: AppEnvironment
              value: public
            # Server-side base URL for the FastAPI backend (in-cluster Service).
            # The browser never sees this; all backend calls are proxied by Next.js.
            - name: API_BASE_URL
              value: http://transcription-api
            # Optional Bloom worklog API key for the in-app feedback relay
            # (app/api/bloom-feedback). optional:true so the UI still starts if
            # the secret/key is absent — the relay then posts unauthenticated,
            # which Bloom accepts today (network-trust).
            - name: BLOOM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: transcription-ui-settings
                  key: bloom_api_key
                  optional: true
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: transcription-ui
  namespace: transcription
  labels:
    app: transcription-ui
spec:
  type: ClusterIP
  selector:
    app: transcription-ui
  ports:
    - name: http
      port: 80
      targetPort: 3000
