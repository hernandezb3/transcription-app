# SonarQube analysis config for the transcription app FRONTEND (Next.js).
# Scanned from this subdir (projectBaseDir=frontend) by .github/workflows/sonarqube.yml
# against the self-hosted server at https://sonarqube.okeanoslabs.com.
sonar.projectKey=transcription-frontend
sonar.projectName=Transcription App — Frontend

# Source lives under app/ and lib/ (+ the edge middleware). Paths are relative
# to this file's directory.
sonar.sources=app,lib,middleware.ts
sonar.sourceEncoding=UTF-8

# Coverage can be added later (npm test -> coverage/lcov.info) via:
#   sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/*.test.*,**/*.spec.*
